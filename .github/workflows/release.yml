name: Release Assets

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to create/use (for example: v1.2.3)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  upload-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
            echo "release_tag=${tag}" >> "$GITHUB_OUTPUT"
            echo "release_name=${tag}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${{ inputs.tag_name }}" ]]; then
            tag="${{ inputs.tag_name }}"
            echo "release_tag=${tag}" >> "$GITHUB_OUTPUT"
            echo "release_name=${tag}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --tags --force
          latest="$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          if [[ -z "${latest}" ]]; then
            next_tag="v0.1.0"
            echo "release_tag=${next_tag}" >> "$GITHUB_OUTPUT"
            echo "release_name=${next_tag}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          major="$(echo "${latest}" | cut -d. -f1 | tr -d 'v')"
          minor="$(echo "${latest}" | cut -d. -f2)"
          patch="$(echo "${latest}" | cut -d. -f3)"
          next_patch="$((patch + 1))"
          next_tag="v${major}.${minor}.${next_patch}"

          echo "release_tag=${next_tag}" >> "$GITHUB_OUTPUT"
          echo "release_name=${next_tag}" >> "$GITHUB_OUTPUT"

      - name: Build bundle
        run: |
          tar -czf artisan-agents.tar.gz agents specs skills
      - name: Upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.release_tag }}
          name: ${{ steps.vars.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            install-agents.sh
            artisan-agents.tar.gz
