name: Release Assets

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to create/use (for example: v1.2.3)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  upload-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build bundle
        run: |
          tar -czf artisan-agents.tar.gz agents specs skills
      - name: Upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || startsWith(github.ref, 'refs/tags/') && github.ref_name || format('main-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Main Build {0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            install-agents.sh
            artisan-agents.tar.gz
